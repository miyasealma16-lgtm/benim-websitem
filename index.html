	<!DOCTYPE html>
	<html>
	<head>
	    <meta charset="UTF-8">
	    <title>Doğum Günüme Davetlisiniz! 🎉</title>
	    <style>
	        body {
	            background-color: #fce4ec;
	            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
	            text-align: center;
	            padding: 40px;
	        }
	        .kart {
	            background-color: #ffffff;
	            border-radius: 20px;
	            padding: 30px;
	            max-width: 500px;
	            margin: 0 auto;
	            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
	            border: 3px solid #f48fb1;
	        }
	        h1 {
	            color: #d81b60;
	            font-size: 28px;
	        }
	        h2 {
	            color: #8e24aa;
	        }
	        p {
	            color: #555555;
	            font-size: 18px;
	            line-height: 1.6;
	        }
	        .detay {
	            background-color: #f3e5f5;
	            padding: 15px;
	            border-radius: 10px;
	            margin-top: 20px;
	            text-align: left;
	        }
	        .detay p {
	            margin: 8px 0;
	            font-size: 16px;
	            color: #4a148c;
	        }
	    </style>
	</head>
	<body>

	    <div class="kart">
	        <h1>🎂 Doğum Günü Kutlaması 🥳</h1>
	        <h2>Birlikte Kutlayalım!</h2>
	        <p>Yeni yaşımı sevdiklerimle birlikte harika bir akşamda kutlamak istiyorum. Sen de davetlimsin!</p>
	        
	        <div class="detay">
	            <p>📅 <strong>Tarih:</strong> 25 Ekim Cumartesi</p>
	            <p>⏰ <strong>Saat:</strong> 19:00</p>
	            <p>📍 <strong>Yer:</strong> Bizim Ev / Kafe</p>
	            <p>🎈 <strong>Not:</strong> Gelirken neşeni getirmeyi unutma!</p>
	        </div>
	    </div>

	</body>
	</html>
